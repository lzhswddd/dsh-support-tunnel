<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Support tunnel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202c"/>
      <stop offset="1" stop-color="#0d151e"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ba7a0"/>
      <stop offset="0.5" stop-color="#57d6c0"/>
      <stop offset="1" stop-color="#3ba7a0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" fill="none" stroke="#2b3d4d" stroke-width="1.5"/>

  <!-- client node -->
  <rect x="15" y="42" width="22" height="44" rx="6" fill="#22303f" stroke="#4a6a82" stroke-width="2"/>
  <circle cx="26" cy="52" r="2.6" fill="#57d6c0"/>

  <!-- server node -->
  <rect x="91" y="34" width="22" height="60" rx="6" fill="#22303f" stroke="#4a6a82" stroke-width="2"/>
  <rect x="95.5" y="60" width="13" height="2.6" rx="1.3" fill="#4a6a82"/>
  <rect x="95.5" y="67" width="13" height="2.6" rx="1.3" fill="#4a6a82"/>
  <rect x="95.5" y="74" width="9" height="2.6" rx="1.3" fill="#4a6a82"/>

  <!-- tunnel pipe -->
  <path d="M37 56 H91" stroke="url(#pipe)" stroke-width="9" stroke-linecap="round" opacity="0.22"/>
  <path d="M37 56 H91" stroke="url(#pipe)" stroke-width="3" stroke-linecap="round"/>
  <path d="M37 72 H91" stroke="url(#pipe)" stroke-width="9" stroke-linecap="round" opacity="0.22"/>
  <path d="M37 72 H91" stroke="url(#pipe)" stroke-width="3" stroke-linecap="round"/>

  <!-- payload travelling inside the tunnel -->
  <circle cx="52" cy="64" r="3.4" fill="#d8fff5"/>
  <circle cx="64" cy="64" r="2.6" fill="#8ff0dd" opacity="0.9"/>
  <circle cx="75" cy="64" r="2" fill="#57d6c0" opacity="0.7"/>

  <!-- keyhole: one port in -->
  <circle cx="64" cy="24" r="7" fill="none" stroke="#57d6c0" stroke-width="2.4"/>
  <rect x="62.6" y="28" width="2.8" height="7" rx="1.4" fill="#57d6c0"/>
</svg>
