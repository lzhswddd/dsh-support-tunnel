- insert:
    - id: support-tunnel
      name: '@local/support-tunnel'
      config:
        # This plugin is the control side only. The tunnel endpoint runs as a
        # separate process — see ../tunnel-server/README.md.
        #
        # The admin API has its own port (24444), separate from the tunnel
        # listener (24443), and serves https with the tunnel's certificate.
        # Over the internet the certificate cannot be verified by a public CA,
        # so the sha256 fingerprint is pinned instead.
        remoteUrl: 'https://127.0.0.1:24444'
        remoteTimeoutMs: 8000
        # Only needed when the admin API is bound beyond loopback, i.e. when this
        # machine is not the tunnel server. Deliberately empty here: a committed
        # token would be published with the repository. Set it in the profile
        # patch (`~/.dsh/profiles/<profile>/cordis.patch.yml`, not versioned) or
        # export TUNNEL_API_TOKEN instead.
        remoteToken: ''
        remoteFingerprint: 'sha256:eY2bT4vockxqUTwQEwayqN3VvEuTC8EPIz0aUvHTe8Y'
        # Which kits this control side may see.
        #
        # Left empty on purpose: the plugin reads the DSH account it is signed in
        # as (deepseekAccount) and sends it to the server, which returns only the
        # kits owned by that account. Any other computer signed in with the same
        # account therefore sees exactly the same devices.
        #
        # Set a comma separated list here (for example 'k5a1dad4e,k8f8fe16a')
        # only when you want to narrow it further on this machine.
        kitId: ''
        # Fallback login account when a client reports a machine account
        # (NAME$), e.g. when its agent was started by a SYSTEM task.
        clientUser: 'lzh'
        # VNC password configured on the customer machines; noVNC fills it in
        # automatically so 「远程查看」 is a single click. A per-machine value
        # set via tunnel_vnc action=password takes precedence.
        vncPassword: 'dsh2026'
