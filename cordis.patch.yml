- insert:
    - id: support-tunnel
      name: '@local/support-tunnel'
      config:
        # This plugin is the control side only. The tunnel endpoint runs as a
        # separate process — see ../tunnel-server/README.md.
        remoteUrl: 'http://127.0.0.1:24444'
        remoteTimeoutMs: 8000
        # Which kits this control side may see.
        #
        # Left empty on purpose: the plugin now reads the DSH account it is
        # signed in as (deepseekAccount) and sends it to the server, which
        # returns only the kits owned by that account. Any other computer
        # signed in with the same account therefore sees exactly the same
        # devices, with no per-machine kit configuration.
        #
        # Set a comma separated list here (for example 'k5a1dad4e,k8f8fe16a')
        # only when you want to narrow it further on this machine.
        kitId: ''
        # Fallback login account when a client reports a machine account
        # (NAME$), e.g. when its agent was started by a SYSTEM task.
        clientUser: 'lzh'
        # VNC password configured on the customer machines; noVNC fills it in
        # automatically so 「远程查看」 is a single click. A per-machine value
        # set via tunnel_vnc action=password takes precedence.
        vncPassword: 'dsh2026'
